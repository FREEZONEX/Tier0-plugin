name: Plugin checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s plugins/tier0/tests -v
      - name: Check marketplace and plugin paths
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('.')
          market = json.loads((root / '.agents/plugins/marketplace.json').read_text())
          assert market['name'] == 'tier0'
          for entry in market['plugins']:
              plugin = root / entry['source']['path']
              manifest = json.loads((plugin / '.codex-plugin/plugin.json').read_text())
              assert manifest['name'] == entry['name'] == plugin.name
              assert (plugin / manifest['skills'] / 'platform/SKILL.md').is_file()
          PY
